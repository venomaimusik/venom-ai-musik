<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom AI Musik – Songs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>VENOM AI MUSIK</h1>

    <nav>
        <a href="index.html">🏠 Startseite</a>
    </nav>
</header>

<section class="songs">

    <h2>Meine Songs</h2>


<input
    type="text"
    id="searchInput"
    placeholder="🔍 Song suchen...">

<div class="music-layout">
    <div id="playlist"></div>

<div class="player">

    <img id="cover" src="" class="song-cover">

    <h3 id="title">Kein Song ausgewählt</h3>

    <div class="progress">
        <div class="progress-fill" id="progress"></div>
    </div>

    <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
    <button id="prevBtn">⏮</button>
    <button id="shuffleBtn">🔀</button>
    <button id="favoriteBtn">🤍</button>
    <button id="playBtn">▶</button>
    <button id="nextBtn">⏭</button>
</div>
    
    <div class="volume">
        🔊
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
    </div>

    </div>
</section>
<audio id="audio">
    <source src="songs/Keine andere kommt an dich ran.mp3" type="audio/mpeg">
</audio>

<script src="songs.js"></script>

</body>
</html>
